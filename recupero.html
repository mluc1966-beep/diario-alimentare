<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recupero Diario v2</title>
<style>body{font-family:system-ui;margin:18px;max-width:900px}button{font-size:18px;padding:12px;margin:6px 4px}.box{padding:12px;border:1px solid #ccc;border-radius:10px;margin:10px 0}.good{background:#eaf7ee}.warn{background:#fff3cd}</style>
<h1>Recupero locale Diario v2</h1>
<p><b>Ripristino locale controllato.</b> Prima del ripristino salva automaticamente lo stato attuale come ulteriore snapshot.</p>
<input id="file" type="file" accept=".json,application/json"><div id="out"></div>
<script>
const DB='diario_alimentare_db', KEY='diario_crea_v2', META='diario_crea_v2_meta';
let recovered=null;
function summary(d){let days=0,entries=0,last='';for(const w of Object.values(d?.weeks||{}))for(const [ds,day] of Object.entries(w?.days||{})){let active=false;for(const p of ['Luca','Daniela']){const n=(day?.[p]?.entries||[]).length;entries+=n;if(n||day?.[p]?.closed)active=true}if(active){days++;if(ds>last)last=ds}}return{days,entries,last}}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('app'))d.createObjectStore('app',{keyPath:'key'});if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function get(db,st,k){return new Promise((res,rej)=>{const r=db.transaction(st).objectStore(st).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(db,st,v){return new Promise((res,rej)=>{const r=db.transaction(st,'readwrite').objectStore(st).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
file.onchange=async()=>{try{const obj=JSON.parse(await file.files[0].text()),d=obj.data||obj;if(!d?.settings||!d?.weeks)throw Error('JSON non riconosciuto');recovered=d;const s=summary(d);out.innerHTML=`<div class="box good"><b>Copia pronta</b><br>Giorni: ${s.days} · voci: ${s.entries} · ultimo giorno: ${s.last||'—'}<br><button id="restore">RIPRISTINA QUESTA COPIA</button></div>`;restore.onclick=doRestore}catch(e){out.innerHTML='<div class="box warn">File non valido: '+e.message+'</div>'}}
async function doRestore(){if(!recovered)return;restore.disabled=true;try{const db=await openDB(),cur=await get(db,'app','current'),stamp=new Date().toISOString();if(cur?.data)await put(db,'snapshots',{id:'safety:prima-recupero:'+stamp,createdAt:stamp,label:'Prima del recupero manuale',data:cur.data,version:cur.version||61});if(cur?.data)await put(db,'app',{key:'previous',data:cur.data,updatedAt:cur.updatedAt||stamp,createdAt:stamp,label:'Copia precedente al recupero',version:cur.version||61});await put(db,'app',{key:'current',data:recovered,updatedAt:stamp,reason:'recupero manuale safety',version:61});localStorage.setItem(KEY,JSON.stringify(recovered));localStorage.setItem(META,JSON.stringify({updatedAt:stamp}));const s=summary(recovered);out.innerHTML=`<div class="box good"><b>RIPRISTINO COMPLETATO</b><br>${s.days} giorni · ${s.entries} voci · ultimo giorno ${s.last}.<br><br><b>Ora chiudi questa scheda e apri il Diario. NON premere Sincronizza ora.</b></div>`}catch(e){restore.disabled=false;out.innerHTML='<div class="box warn"><b>Ripristino NON eseguito.</b><br>'+e.message+'</div>'}}
</script>
