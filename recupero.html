<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recupero Diario</title>
<style>body{font-family:system-ui;margin:18px;max-width:900px}button{font-size:18px;padding:12px;margin:5px}.bad{color:#a11}</style>
<h1>Recupero locale Diario</h1><p><b>Non modifica e non sincronizza il Diario.</b> Legge le copie locali di questo browser.</p><button id="scan">Cerca copie locali</button><div id="out"></div>
<script>
const DB='diario_alimentare_db';
function dl(name,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function summary(d){let days=0,entries=0,last='';for(const w of Object.values(d?.weeks||{}))for(const [ds,day] of Object.entries(w?.days||{})){let n=0;for(const p of ['Luca','Daniela'])n+=(day?.[p]?.entries||[]).length;if(n||day?.Luca?.closed||day?.Daniela?.closed){days++;entries+=n;if(ds>last)last=ds}}return{days,entries,last}}
async function scan(){const out=document.querySelector('#out');out.innerHTML='Lettura…';try{const req=indexedDB.open(DB);const db=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});let rows=[];for(const store of ['app','snapshots'])if(db.objectStoreNames.contains(store)){const r=db.transaction(store,'readonly').objectStore(store).getAll();const all=await new Promise((res,rej)=>{r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});for(const x of all)if(x?.data)rows.push({source:store,id:x.key||x.id||'',time:x.updatedAt||x.createdAt||'',label:x.label||'',data:x.data})}try{const raw=localStorage.getItem('diario_crea_v2');if(raw)rows.push({source:'localStorage',id:'diario_crea_v2',time:'',label:'Specchio locale',data:JSON.parse(raw)})}catch(e){}rows.sort((a,b)=>String(b.time).localeCompare(String(a.time)));if(!rows.length){out.innerHTML='<p class=bad>Nessuna copia trovata.</p>';return}out.innerHTML='<h2>Copie trovate: '+rows.length+'</h2>';rows.forEach((x,i)=>{const s=summary(x.data),d=document.createElement('div');d.innerHTML='<hr><b>#'+(i+1)+' '+x.source+' — '+(x.id||x.label)+'</b><br>Data copia: '+(x.time||'non registrata')+'<br>Giorni registrati: '+s.days+' · voci: '+s.entries+' · ultimo giorno: '+(s.last||'—')+'<br>';const bt=document.createElement('button');bt.textContent='Esporta questa copia';bt.onclick=()=>dl('RECUPERO_'+x.source+'_'+String(x.id||i).replace(/[^a-z0-9_-]/gi,'_')+'.json',{format:'diario-recupero-locale',exportedAt:new Date().toISOString(),source:x.source,id:x.id,time:x.time,data:x.data});d.appendChild(bt);out.appendChild(d)})}catch(e){out.innerHTML='<p class=bad>Errore: '+String(e.message||e)+'</p>'}}
document.querySelector('#scan').onclick=scan;
</script>
